name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to production (blue-green)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  engine-tests:
    # Python 배차 엔진 (packages/dispatch-engine) — 파서·로테이션·솔버 불변식.
    # 실데이터 의존 테스트는 파일이 없으면 자동 skip 된다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: packages/dispatch-engine/requirements-dev.txt
      - name: Install engine dependencies
        run: cd packages/dispatch-engine && pip install -r requirements-dev.txt
      - name: Engine tests
        run: cd packages/dispatch-engine && python -m pytest tests/ -q

  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install backend dependencies
        run: cd packages/backend && npm ci
      - name: Install admin-web dependencies
        run: cd packages/admin-web && npm ci
      - name: Generate Prisma client
        run: cd packages/backend && npx prisma@5 generate
      - name: TypeScript check (backend)
        run: cd packages/backend && npx tsc --noEmit
      - name: TypeScript check (backend scripts — backtest CLIs)
        run: cd packages/backend && npx tsc --noEmit -p tsconfig.scripts.json
      - name: TypeScript check (admin-web)
        run: cd packages/admin-web && npx tsc --noEmit

  mobile-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install root deps (workspaces)
        run: npm install --legacy-peer-deps
      - name: TypeScript check (mobile)
        run: cd packages/mobile && npx tsc --noEmit

  test-backend:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: busync_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: cd packages/backend && npm ci
      - run: cd packages/backend && npx prisma@5 generate
      - name: Run migrations
        run: cd packages/backend && npx prisma@5 migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/busync_test
      - name: Run tests
        run: cd packages/backend && npm test -- --coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/busync_test
          JWT_SECRET: test-secret-key-that-is-long-enough-for-validation
          ANTHROPIC_API_KEY: test-key
          NODE_ENV: test

  build-admin:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: cd packages/admin-web && npm ci
      - name: Build admin web
        run: cd packages/admin-web && npm run build

  # 백테스트 파이프라인 무결성 검증 (StubAgent 사용 — Anthropic API 키 불필요)
  # 시나리오 생성기 → 도구 호출 → DB 변경 → 측정 → 정리 전체 흐름 검증
  smoke-backtest:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: busync_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/busync_test
      JWT_SECRET: test-secret-key-that-is-long-enough-for-validation
      ANTHROPIC_API_KEY: sk-ant-ci-stub-not-used-by-stubagent
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: cd packages/backend && npm ci
      - run: cd packages/backend && npx prisma@5 generate
      - name: Run migrations
        run: cd packages/backend && npx prisma@5 migrate deploy
      - name: EmergencyAgent smoke backtest (StubAgent)
        run: cd packages/backend && npm run backtest:emergency -- --smoke --drops=10
      - name: DispatchAgent smoke backtest (StubAgent)
        run: cd packages/backend && npm run backtest:dispatch -- --smoke --scenarios=2

  e2e-admin:
    # 2026-09-03: 셀렉터 문제는 해소됐다 — 로컬(백엔드가 떠 있는 상태)에서
    # 25개 통과·0 실패. CI 에서만 전멸했던 원인은 백엔드를 `&` 로만 띄우고
    # 준비를 기다리지 않은 것이었다(아래 Start/Wait 스텝에서 고침).
    # 다음 몇 번의 실행이 안정적으로 초록이면 이 줄을 지워 차단 잡으로 되돌릴 것.
    continue-on-error: true
    runs-on: ubuntu-latest
    needs: build-admin
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: busync_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install backend dependencies
        run: cd packages/backend && npm ci
      - name: Generate Prisma client
        run: cd packages/backend && npx prisma@5 generate
      - name: Run migrations
        run: cd packages/backend && npx prisma@5 migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/busync_test
      - name: Seed database
        run: cd packages/backend && npx prisma@5 db seed
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/busync_test
          JWT_SECRET: test-secret-key-that-is-long-enough-for-validation
          ANTHROPIC_API_KEY: test-key
          NODE_ENV: test
      # `npm run dev &` 만 두면 스텝의 셸이 끝날 때 같이 죽고, 살아남아도
      # 준비되기 전에 테스트가 시작된다. 그러면 vite 프록시가 /api 를 못 붙여
      # **로그인이 전부 실패**하고, 로그인이 필요한 테스트 19개가 통째로
      # 무너진다(2026-09-03 진단: 로컬에서는 같은 스위트가 25개 통과).
      - name: Start backend
        run: |
          cd packages/backend
          nohup npm run dev > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/busync_test
          JWT_SECRET: test-secret-key-that-is-long-enough-for-validation
          ANTHROPIC_API_KEY: test-key
          NODE_ENV: test
          PORT: 4000
      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/health > /dev/null; then
              echo "backend up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::백엔드가 60초 안에 뜨지 않았습니다"; tail -50 /tmp/backend.log; exit 1
      - name: Install admin-web dependencies
        run: cd packages/admin-web && npm ci
      - name: Install Playwright browsers
        run: cd packages/admin-web && npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: cd packages/admin-web && npm run test:e2e
        env:
          CI: true
      - name: Backend log (실패 진단용)
        if: ${{ failure() }}
        run: tail -100 /tmp/backend.log || true
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: packages/admin-web/playwright-report/
          retention-days: 30

  # Blue-Green 배포 (수동 트리거)
  deploy:
    runs-on: ubuntu-latest
    needs: [test-backend, build-admin, smoke-backtest]
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.deploy == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose -f docker-compose.prod.yml build

      - name: Start infrastructure services
        run: docker compose -f docker-compose.prod.yml up -d postgres redis nginx admin-web

      - name: Wait for infrastructure
        run: |
          echo "Waiting for postgres and redis..."
          sleep 10
          docker compose -f docker-compose.prod.yml ps

      - name: Run blue-green deployment
        run: ./scripts/deploy.sh

      - name: Verify deployment
        run: |
          ACTIVE=$(cat .current-color)
          echo "Active instance: $ACTIVE"
          docker compose -f docker-compose.prod.yml ps
          docker compose -f docker-compose.prod.yml exec "backend-$ACTIVE" wget --no-verbose --tries=1 --spider http://localhost:4000/health
